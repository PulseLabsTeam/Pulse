# Population Training Configuration
# Week 2 Day 11-14

model_name: "gpt2"
reward_model_path: "pulseos_rlhf/reward_model"
device: "cuda"

# PPO settings
learning_rate: 1.41e-5
batch_size: 16
mini_batch_size: 4
ppo_epochs: 4
ppo_clip_epsilon: 0.2

# Generation settings
max_length: 512
max_new_tokens: 64

# Population settings
population_size: 5
elimination_rate: 0.2  # Eliminate 20% worst performers

# Convergence settings
target_reward: -1.0
convergence_window: 20
min_samples: 200
max_samples: 5000

# Training settings
max_generations: 10
steps_per_generation: 100


